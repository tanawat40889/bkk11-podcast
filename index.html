<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#121212" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="BKK11 Podcast" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/favicon-64.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<title>BKK11 Podcast</title>
<script>
// เปิดจาก LINE: ให้ LINE ส่งต่อไปเบราว์เซอร์หลักของเครื่อง (LINE รองรับพารามิเตอร์ openExternalBrowser=1)
if (/\bLine\//i.test(navigator.userAgent) && !/[?&]openExternalBrowser=1/.test(location.search))
  location.replace(location.pathname + (location.search ? location.search + '&' : '?') + 'openExternalBrowser=1' + location.hash);
</script>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{--bg:#121212;--s1:#181818;--s2:#282828;--s3:#3e3e3e;--text:#fff;--mute:#b3b3b3;--dim:#727272;--acc:#1ed760;--bad:#f3727f;--pc:#7c5cff;
  --st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Prompt',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{display:block;fill:currentColor}
.ic{width:24px;height:24px}

/* ---------- Home ---------- */
.home{max-width:760px;margin:0 auto;padding-bottom:calc(150px + var(--sb))}
.hero{position:relative;padding:calc(28px + var(--st)) 16px 20px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--pc) 75%,#000) 0%,color-mix(in srgb,var(--pc) 35%,var(--bg)) 55%,var(--bg) 100%);transition:background .4s}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:28px 8px calc(8px + var(--sb));pointer-events:none;
  background:linear-gradient(180deg,#12121200 0,#121212e6 28px,#121212 60%)}
.dock-in{max-width:744px;margin:0 auto;display:flex;flex-direction:column;gap:8px;pointer-events:auto}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;justify-content:center}
.chip{flex:none;padding:7px 14px;border-radius:999px;background:#ffffff1f;font-size:14px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--acc);color:#000}
.chip.locked{color:var(--mute)}
.cover{aspect-ratio:1;border-radius:6px;position:relative;overflow:hidden;color:#fff;
  background:radial-gradient(120% 90% at 20% 10%,color-mix(in srgb,var(--pc) 40%,#fff) 0%,var(--pc) 45%,color-mix(in srgb,var(--pc) 45%,#000) 100%);
  box-shadow:0 8px 40px #0008;container-type:inline-size}
.cover .c-ic{position:absolute;right:-8%;bottom:-6%;width:62%;opacity:.22}
.cover .c-t{position:absolute;left:8%;top:8%;right:8%;font-weight:800;line-height:1.02;font-size:15cqi;letter-spacing:-.5px}
.cover .c-p{position:absolute;left:8%;bottom:8%;font-weight:700;font-size:8cqi;background:#000a;padding:.2em .6em;border-radius:.3em}
.cover .c-b{position:absolute;right:7%;top:7%;font-weight:800;font-size:6cqi;opacity:.85}
.hero .cover{width:min(60vw,240px);margin:0 auto 20px}
h1{margin:0 0 6px;font-size:clamp(24px,6.5vw,34px);font-weight:800;letter-spacing:-.5px;line-height:1.15}
.by{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.by img{width:24px;height:24px;border-radius:50%}
.meta{color:var(--mute);font-size:13px;margin-top:6px}
.bar-actions{display:flex;align-items:center;gap:20px;margin-top:14px}
.scorebox{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:13px;padding:6px 12px;border:1px solid var(--s3);border-radius:999px}
.scorebox b{color:var(--text)}
.more{color:var(--mute);width:32px;height:32px;display:grid;place-items:center}
.bigplay{margin-left:auto;width:56px;height:56px;border-radius:50%;background:var(--acc);color:#000;display:grid;place-items:center;transition:transform .1s}
.bigplay:active{transform:scale(.94)}
.bigplay .ic{width:28px;height:28px}
.bigplay:disabled{opacity:.35}

.list{list-style:none;margin:8px 0 0;padding:0 8px}
.row{display:grid;grid-template-columns:32px 1fr auto;align-items:center;gap:12px;padding:10px 8px;border-radius:6px;cursor:pointer;user-select:none}
.row:hover{background:#ffffff12}
.row:active{background:#ffffff1f}
.row .n{color:var(--mute);text-align:center;font-variant-numeric:tabular-nums}
.row .t{font-weight:500;font-size:16px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row.cur .t{color:var(--acc)}
.row .s{color:var(--mute);font-size:13px;margin-top:2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row .prog{height:3px;border-radius:2px;background:var(--s3);width:72px;overflow:hidden}
.row .prog i{display:block;height:100%;background:var(--mute)}
.row.cur .prog i{background:var(--acc)}
.badge{font-size:11px;font-weight:600;padding:1px 6px;border-radius:3px;background:var(--s2);color:var(--mute)}
.badge.ok{background:#1ed76022;color:var(--acc)}
.row .pp{width:32px;height:32px;border-radius:50%;border:1px solid var(--s3);display:grid;place-items:center;color:var(--text)}
.row .pp .ic{width:16px;height:16px}
.eq{display:flex;gap:2px;align-items:flex-end;height:14px;justify-content:center}
.eq i{width:3px;background:var(--acc);animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.35s}.eq i:nth-child(3){animation-delay:-.7s}
.eq.stop i{animation:none;height:4px}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}
.soon{margin:24px 16px;padding:36px 20px;border-radius:8px;background:var(--s1);text-align:center;color:var(--mute)}
.soon b{display:block;color:var(--text);font-size:18px;margin-bottom:4px}
.foot{padding:28px 16px;color:var(--dim);font-size:12px;text-align:center}
.foot button{text-decoration:underline;color:var(--dim)}

/* ---------- Mini player ---------- */
.mini{position:relative;display:none;grid-template-columns:40px 1fr auto auto;align-items:center;gap:10px;padding:8px 8px 10px;border-radius:8px;
  background:color-mix(in srgb,var(--pc) 45%,#1a1a1a);box-shadow:0 6px 20px #0009;cursor:pointer;
  transition:background .4s}
.mini.on{display:grid;grid-template-columns:40px 1fr auto auto;animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.mini .cover{border-radius:4px;box-shadow:none}
.mini .t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .a{font-size:12px;color:#ffffffb3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .qb{font-size:11px;font-weight:600;color:#000;background:var(--acc);border-radius:999px;padding:2px 8px}
.mini .qb:empty{display:none}
.mini .mp{width:36px;height:36px;display:grid;place-items:center}
.mini .mp .ic{width:26px;height:26px}
.mini .line{position:absolute;left:8px;right:8px;bottom:0;height:2px;background:#ffffff40;border-radius:1px;overflow:hidden}
.mini .line i{display:block;height:100%;background:#fff;width:0}

/* ---------- Now playing ---------- */
.np{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;
  padding:calc(12px + var(--st)) 24px calc(24px + var(--sb));
  background:linear-gradient(180deg,color-mix(in srgb,var(--pc) 60%,#000) 0%,color-mix(in srgb,var(--pc) 22%,#121212) 60%,#121212 100%);
  transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);overflow-y:auto}
.np.on{transform:none}
.np-in{width:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;flex:1;gap:20px}
.np-top{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;text-align:center}
.np-top small{display:block;font-size:11px;letter-spacing:1px;color:#ffffffb3;text-transform:uppercase}
.np-top b{font-size:14px}
.np-top button{width:40px;height:40px;display:grid;place-items:center}
.np .cover{width:100%;max-width:min(460px,52vh);margin:auto;border-radius:8px}
.np-meta{display:flex;align-items:center;gap:12px}
.np-meta div{flex:1;min-width:0}
.np-meta h2{margin:0;font-size:20px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.np-meta p{margin:2px 0 0;color:#ffffffb3;font-size:15px}
.qpill{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:#ffffff1f;white-space:nowrap}
.scrub{position:relative;height:18px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.track{position:relative;width:100%;height:4px;border-radius:2px;background:#ffffff4d}
.fill{position:absolute;inset:0 auto 0 0;background:#fff;border-radius:2px}
.scrub:hover .fill,.scrub.drag .fill{background:var(--acc)}
.knob{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 2px 4px #0006}
.times{display:flex;justify-content:space-between;color:#ffffffb3;font-size:12px;margin-top:-12px;font-variant-numeric:tabular-nums}
.ctl{display:flex;align-items:center;justify-content:space-between}
.ctl button{width:48px;height:48px;display:grid;place-items:center;color:#fff}
.ctl button:disabled{opacity:.3}
.ctl .ic{width:30px;height:30px}
.ctl .main{width:68px;height:68px;border-radius:50%;background:#fff;color:#000;transition:transform .1s}
.ctl .main:active{transform:scale(.94)}
.ctl .main .ic{width:32px;height:32px}
.rate{font-size:14px;font-weight:700}

/* ---------- Question sheet ---------- */
.modal{position:fixed;inset:0;z-index:10;background:#000b;display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s}
.modal.on{opacity:1;pointer-events:auto}
.sheet{overflow-anchor:none;width:100%;max-width:560px;background:var(--s2);border-radius:16px 16px 0 0;padding:10px 20px calc(24px + var(--sb));
  display:flex;flex-direction:column;gap:12px;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-height:94dvh;overflow-y:auto}
.modal.on .sheet{transform:none}
@media (min-width:600px){.modal{align-items:center}.sheet{border-radius:16px;padding-bottom:24px}}
.grab{width:36px;height:4px;border-radius:2px;background:var(--s3);margin:0 auto 6px}
.tag{display:flex;align-items:center;gap:8px;color:var(--acc);font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.q{font-size:20px;font-weight:700;line-height:1.4}
.q .sets,.q .info,.q .wrong{font-weight:400}.q .info h3,.q .sets b{font-weight:700}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{padding:14px 16px;border-radius:8px;background:var(--s3);text-align:left;font-size:16px;line-height:1.4;transition:background .15s}
.opt:hover:not(:disabled){background:#4d4d4d}
.opt.ok{background:var(--acc);color:#000;font-weight:600}
.opt.bad{background:var(--bad);color:#000}
.opt:disabled{cursor:default}
.opt:disabled:not(.ok):not(.bad){opacity:.5}
.fb{font-weight:600;min-height:1.4em}
.go{align-self:stretch;padding:14px;border-radius:999px;background:#fff;color:#000;font-weight:700;font-size:16px;display:none}
.go.ghost{background:none;color:var(--mute);border:1px solid var(--s3)}
.qdots{display:flex;gap:4px}.qdots i{flex:1;height:4px;border-radius:2px;background:var(--s3)}
.qdots i.ok{background:var(--acc)}.qdots i.bad{background:var(--bad)}.qdots i.now{background:#fff}
.result{text-align:center;padding:8px 0}
.result .big{font-size:56px;font-weight:800;line-height:1.1}.result .big small{font-size:24px;color:var(--mute)}
.result p{color:var(--mute);margin:6px 0 0}
button.badge{cursor:pointer}
.qbtn{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:8px 16px;border-radius:999px;background:var(--acc);color:#000;font-size:14px;font-weight:700;white-space:nowrap;transition:transform .1s}
.qbtn:hover{transform:scale(1.04)}.qbtn:active{transform:scale(.96)}
.qbtn.warn{background:#ffd166}
.qbtn.done{background:none;color:var(--acc);border:1.5px solid var(--acc);padding:6.5px 14px}
#retry{background:#ffd166;color:#000;border:0}
.qpill,.mini .qb{cursor:pointer}
.badge.todo{background:var(--acc);color:#000}
.qdots.many{gap:2px}
.info{margin:16px;padding:18px;border-radius:12px;background:var(--s1);border:1px solid var(--s2);text-align:left}
.sheet .info{margin:0;background:#1f1f1f}
.info h3{margin:0 0 12px;font-size:17px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.info .cd{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--acc);color:#000;white-space:nowrap}
.info dl{margin:0;display:grid;grid-template-columns:28px 1fr;row-gap:10px;font-size:15px;line-height:1.45}
.info dt{font-size:18px}.info dd{margin:0}.info dd small{display:block;color:var(--mute);font-size:13px}
.info a{color:var(--acc);font-weight:600}
.info h4{margin:16px 0 8px;font-size:14px;color:var(--mute);font-weight:600}
.info ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.45}
.info li{display:grid;grid-template-columns:28px 1fr}
.sets{display:flex;flex-direction:column;gap:6px;font-size:14px;text-align:left}
.sets div{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.sets .bar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--s3);overflow:hidden}
.sets .bar i{display:block;height:100%;background:var(--acc)}
.wrong{display:flex;flex-direction:column;gap:10px;text-align:left;font-size:14px;line-height:1.45}
.wrong h4{margin:4px 0 0;font-size:14px;color:var(--mute)}
.wrong div{padding:10px 12px;border-radius:8px;background:#1f1f1f}
.wrong b{display:block;font-weight:500;margin-bottom:4px}
.wrong span{color:var(--acc)}.wrong s{color:var(--bad);display:block}
.textbtn{color:var(--text);font-size:15px;font-weight:600;margin:0 auto;display:block;padding:12px 22px;border:1px solid var(--s3);border-radius:999px}
.textbtn:hover{border-color:#fff}

/* ---------- กล่องคำถาม: ใหญ่ อ่านง่าย กดง่าย ---------- */
.sheet{max-width:820px;gap:16px}
.q{font-size:22px;line-height:1.45}
.opts{gap:10px}
.opt{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:center;padding:14px 16px;border-radius:12px;font-size:17px;line-height:1.45;min-height:60px;border:2px solid transparent}
.opt .k{width:36px;height:36px;border-radius:50%;background:#ffffff1f;display:grid;place-items:center;font-weight:700;font-size:16px}
.opt:hover:not(:disabled){border-color:#ffffff66}
.opt.ok .k,.opt.bad .k{background:#0003}
.tag{font-size:14px}
.qdots i{height:6px;border-radius:3px}
.fb{font-size:17px}
.go{padding:16px;font-size:17px}
@media (max-width:599px){
  .sheet{height:100dvh;max-height:100dvh;border-radius:0;padding:calc(18px + var(--st)) 18px calc(18px + var(--sb))}
  .grab{display:none}
  .fb{margin-top:auto}
  .fb:empty{min-height:0}
}
@media (min-width:600px){
  .sheet{padding:32px 40px 36px;gap:20px;min-height:min(620px,88dvh);border-radius:20px}
  .grab{display:none}
  .q{font-size:27px}
  .opt{font-size:20px;padding:18px 22px;min-height:72px;grid-template-columns:42px 1fr;gap:16px}
  .opt .k{width:42px;height:42px;font-size:18px}
  .tag{font-size:16px}
  .fb{font-size:19px;margin-top:auto}
  .go{font-size:18px;padding:18px}
}

/* ---------- ปุ่มติดตั้งแอป ---------- */
.install{display:none;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;background:#fff;color:#000;font-size:13px;font-weight:700;white-space:nowrap}
.install .ic{width:16px;height:16px}
body.can-install .install{display:inline-flex}
.hero>.install{position:absolute;top:calc(12px + var(--st));right:16px;z-index:1}
@media (max-width:899px){.hero{padding-top:calc(60px + var(--st))}}

/* ---------- ดาว / ระดับ / เหรียญ ---------- */
.stars{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:#0006;font-size:13px;font-weight:700;white-space:nowrap}
.stars b{color:#ffd166}
.hero>.stars{position:absolute;top:calc(12px + var(--st));left:16px;z-index:1}
.help>div{max-height:92dvh;overflow-y:auto}
.rw-top{text-align:center}
.rw-top .em{font-size:52px;line-height:1.1}
.rw-top h3{justify-content:center;margin:6px 0 2px;font-size:22px}
.rw-top .n{font-size:17px;font-weight:700;color:#ffd166}
.rw-bar{height:8px;border-radius:4px;background:var(--s3);overflow:hidden;margin-top:10px}
.rw-bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd166,#ff9f43);border-radius:4px;transition:width .5s}
.rw-top small{display:block;color:var(--mute);margin-top:6px;font-size:13px}
.rw-rows{display:flex;flex-direction:column;gap:8px;font-size:15px}
.rw-rows div{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:8px;background:#1f1f1f}
.rw-rows b{color:#ffd166;white-space:nowrap}
.rw-bd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rw-bd div{text-align:center;font-size:11px;line-height:1.3;color:var(--mute);padding:10px 4px;border-radius:10px;background:#1f1f1f;opacity:.38;filter:grayscale(1)}
.rw-bd div.got{opacity:1;filter:none;color:var(--text);background:#2e2a1a}
.rw-bd span{display:block;font-size:26px;margin-bottom:4px}
.help h4{margin:4px 0 -4px;font-size:14px;color:var(--mute);font-weight:600}
.help button.ghost{background:none;color:var(--mute);border:1px solid var(--s3)}
.toast{position:fixed;left:50%;top:calc(16px + var(--st));transform:translate(-50%,-140%);z-index:20;padding:12px 20px;border-radius:999px;
  background:#ffd166;color:#000;font-weight:700;font-size:15px;white-space:nowrap;box-shadow:0 8px 24px #0008;transition:transform .35s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.toast.on{transform:translate(-50%,0)}
.help{position:fixed;inset:0;z-index:12;background:#000b;display:none;align-items:flex-end;justify-content:center}
.help.on{display:flex}
.help>div{width:100%;max-width:480px;background:var(--s2);border-radius:16px 16px 0 0;padding:22px 22px calc(22px + var(--sb));display:flex;flex-direction:column;gap:14px}
.help h3{margin:0;font-size:19px;display:flex;align-items:center;gap:10px}
.help h3 img{width:40px;height:40px;border-radius:10px}
.help ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px;font-size:15px;line-height:1.5}
.help p{margin:0;color:var(--mute);font-size:13px}
.help button{padding:13px;border-radius:999px;background:#fff;color:#000;font-weight:700}
@media (min-width:600px){.help{align-items:center}.help>div{border-radius:16px}}

/* ---------- Desktop (≥900px): sidebar + แถบเล่นด้านล่าง ---------- */
.side,.vol{display:none}
@media (min-width:900px){
  body{background:#000}
  .side{display:flex;flex-direction:column;gap:8px;position:fixed;left:8px;top:8px;bottom:8px;width:300px;z-index:4;transition:bottom .2s}
  body.has-ep .side{bottom:98px}
  .side>div{background:var(--bg);border-radius:8px;padding:16px}
  .brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:18px}
  .brand{gap:10px;font-size:15px}.brand span{white-space:nowrap}
  .brand img{width:32px;height:32px;border-radius:8px}
  .brand .install{padding:6px 10px;font-size:12px}
  .lib{flex:1;overflow-y:auto;padding:8px!important}
  .lib h5{margin:8px 8px 10px;font-size:14px;color:var(--mute);font-weight:600}
  .lib button{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;width:100%;padding:8px;border-radius:6px;text-align:left}
  .lib button:hover{background:#ffffff12}
  .lib button.on{background:#ffffff1f}
  .lib .cover{border-radius:4px;box-shadow:none}
  .lib b{display:block;font-weight:500;font-size:15px}

<script>
const P = window.PODCAST, $ = id => document.getElementById(id), au = $('au');
const KEY = 'bkk11-podcast';
const I = {
  play: '<svg class="ic" viewBox="0 0 24 24"><path d="M7 4.6v14.8a1 1 0 0 0 1.5.9l12.2-7.4a1 1 0 0 0 0-1.8L8.5 3.7A1 1 0 0 0 7 4.6z"/></svg>',
  pause: '<svg class="ic" viewBox="0 0 24 24"><rect x="5.5" y="4" width="4.5" height="16" rx="1"/><rect x="14" y="4" width="4.5" height="16" rx="1"/></svg>',
  head: '<svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0-9 9v6a3 3 0 0 0 3 3h1a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2H5v-1a7 7 0 0 1 14 0v1h-2a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h1a3 3 0 0 0 3-3v-6a9 9 0 0 0-9-9z"/></svg>'
};
let S; try { S = JSON.parse(localStorage.getItem(KEY)) || {} } catch { S = {} }
S.ans ??= {}; S.pos ??= {}; S.done ??= {}; S.fin ??= {}; S.exam ??= { ans: {}, seed: Date.now() % 1e9 };
const store = () => { try { localStorage.setItem(KEY, JSON.stringify(S)) } catch {} };
let ready = false;
const save = () => { store(); if (ready) checkStars() };
const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') };
const mins = s => Math.max(1, Math.round(s / 60)) + ' นาที';
const allEps = P.parts.flatMap(p => p.episodes);
const partOf = e => P.parts.find(p => p.episodes.includes(e));
let view = P.parts[0], ep = null, busy = false, rates = [1, 1.25, 1.5, 2, .75], ri = 0;

const cover = (p, small) => `<div class="cover">${small ? '' : `<div class="c-t">ติว<br>ธรรมะ</div><div class="c-b">BKK11</div>`}<div class="c-ic">${I.head}</div>${small ? '' : `<div class="c-p">${p.name}</div>`}</div>`;
const setColor = p => document.documentElement.style.setProperty('--pc', p.color || '#7c5cff');
const qk = (e, i) => e.id + ':' + i;
const answered = e => e.questions.filter((q, i) => qk(e, i) in S.ans).length;
const correct = e => e.questions.filter((q, i) => S.ans[qk(e, i)] === q.a).length;
const quizOpen = e => S.fin[e.id] && answered(e) < e.questions.length;
const posOf = e => e === ep ? (au.ended ? 0 : au.currentTime) : (S.pos[e.id] || 0);

function score() {
  let ok = 0, tot = 0;
  allEps.forEach(e => { tot += e.questions.length; ok += correct(e) });
  $('score').innerHTML = $('score2').innerHTML = `🏆 คะแนนท้ายตอน <b>${ok}</b> / ${tot}`;
}
function renderHome() {
  setColor(view);
  $('chips').innerHTML = P.parts.map((p, i) =>
    `<button class="chip${p === view ? ' on' : ''}${p.episodes.length ? '' : ' locked'}" data-i="${i}">${p.episodes.length ? '' : '🔒 '}${p.name}</button>`).join('')
    + `<button class="chip${view === X ? ' on' : ''}" data-i="x">📝 ${X.name}</button>`;
  $('chips').querySelectorAll('.chip').forEach(b => b.onclick = () => { view = b.dataset.i === 'x' ? X : P.parts[b.dataset.i]; renderHome(); scrollTo(0, 0) });
  const items = [...P.parts, X];
  $('lib').innerHTML = items.map((p, i) => `<button class="${p === view ? 'on' : ''}${ep && partOf(ep) === p ? ' cur' : ''}" data-i="${i}">
    <div style="--pc:${p.color}">${cover(p, true)}</div>
    <div><b>${p === X ? X.name : `ติวธรรมะ ${p.name}`}</b><small>${p === X ? `ข้อสอบ · ${XQ.length} ข้อ` : `พอดแคสต์ · ${p.episodes.length} ตอน`}</small></div>
    ${ep && partOf(ep) === p ? `<div class="eq${au.paused ? ' stop' : ''}"><i></i><i></i><i></i></div>` : '<span></span>'}</button>`).join('');
  $('lib').querySelectorAll('button').forEach(b => b.onclick = () => { view = items[b.dataset.i]; renderHome(); scrollTo(0, 0) });
  $('heroCover').innerHTML = cover(view);
  if (view === X) return renderExam();
  $('extra').innerHTML = ''; score();
  $('heroTitle').textContent = `ติวธรรมะ ${view.name}`;
  const tot = view.episodes.reduce((a, e) => a + (e.dur || 0), 0);
  $('heroMeta').textContent = view.episodes.length ? `พอดแคสต์ · ${view.episodes.length} ตอน · ${mins(tot)} · ฟังจบแล้วตอบคำถามท้ายตอน` : 'เร็ว ๆ นี้';
  $('bigplay').disabled = !view.episodes.length;
  $('bigplay').innerHTML = ep && partOf(ep) === view && !au.paused ? I.pause : I.play;
  renderList();
}
function renderList() {
  if (view === X) return renderExamList();
  const L = $('list');
  if (!view.episodes.length) { L.innerHTML = `<li class="soon"><b>🔒 ${view.name}</b>กำลังจะมาเร็ว ๆ นี้ รอติดตามนะ</li>`; return }
  L.innerHTML = view.episodes.map((e, i) => {
    const cur = e === ep, pos = posOf(e), d = e.dur || 1, done = S.done[e.id];
    const nq = e.questions.length, na = answered(e);
    const left = done && !pos ? '✓ ฟังจบแล้ว' : pos > 1 ? `เหลือ ${mins(d - pos)}` : mins(d);
    return `<li class="row${cur ? ' cur' : ''}" data-i="${i}">
      <div class="n">${cur ? `<div class="eq${au.paused ? ' stop' : ''}"><i></i><i></i><i></i></div>` : i + 1}</div>
      <div style="min-width:0"><div class="t">${e.title || e.name}</div>
        <div class="s"><span>${e.name}</span>${pos > 1 && !done ? `<span class="prog"><i style="width:${Math.min(100, pos / d * 100)}%"></i></span>` : ''}<span>${left}</span>
        </div>${!nq ? '' : na < nq ? `<button class="qbtn" data-q="${i}">📝 ${na ? 'ทำ Quiz ต่อ' : 'ทำ Quiz'} · ${nq} ข้อ</button>`
          : correct(e) < nq ? `<button class="qbtn warn" data-q="${i}">🏆 ${correct(e)}/${nq} · 🔁 แก้ตัว</button>`
          : `<button class="qbtn done" data-q="${i}">🏆 ${nq}/${nq} เต็ม!</button>`}</div>
      <div class="pp">${cur && !au.paused ? I.pause : I.play}</div></li>`;
  }).join('');
  L.querySelectorAll('.qbtn').forEach(b => b.onclick = ev => { ev.stopPropagation(); quiz(view.episodes[b.dataset.q]) });
  L.querySelectorAll('.row').forEach(r => r.onclick = () => {
    const e = view.episodes[r.dataset.i];
    e === ep ? toggle() : load(e, true);
  });
}
function renderPlayer() {
  if (!ep) return;
  const p = partOf(ep), nq = ep.questions.length, na = answered(ep);
  $('miniCover').innerHTML = $('npCover').innerHTML = '';
  $('miniCover').innerHTML = cover(p, true); $('npCover').innerHTML = cover(p);
  $('miniT').textContent = ep.title || ep.name; $('miniA').textContent = `${p.name} · ${ep.name} · BKK11 Podcast`;
  $('npT').textContent = ep.title || ep.name; $('npSub').textContent = `${p.name} · ${ep.name}`; $('npFrom').textContent = `ติวธรรมะ ${p.name}`;
  $('npQ').textContent = !nq ? '' : na === nq ? `🏆 ${correct(ep)}/${nq}` : `📝 ทำ Quiz · ${nq} ข้อ`; $('npQ').style.display = nq ? '' : 'none';
  $('miniQ').textContent = nq && na < nq ? '📝 Quiz' : '';
  $('next').disabled = !after(ep);
  $('mini').classList.add('on'); document.body.classList.add('has-ep');
  $('mini').style.setProperty('--pc', p.color); $('np').style.setProperty('--pc', p.color);
}
function load(e, auto) {
  if (ep && au.readyState && !au.ended) { S.pos[ep.id] = au.currentTime; save() }
  ep = e; view = partOf(e); setColor(view); S.last = e.id; save();
  au.src = e.src; au.playbackRate = rates[ri];
  au.onloadedmetadata = () => {
    au.currentTime = S.done[e.id] ? 0 : S.pos[e.id] || 0;
    au.playbackRate = rates[ri]; tick();
    if (auto) au.play().catch(() => {});
  };
  renderHome(); renderPlayer(); media(); tick();
}
function toggle() { au.paused ? au.play().catch(e => alert('เล่นเสียงไม่ได้: ' + e.message)) : au.pause() }
function seek(t) {
  if (!ep) return;
  au.currentTime = Math.max(0, Math.min(t, au.duration || 0)); tick();
}
function tick() {
  const d = au.duration || (ep && ep.dur) || 0, t = au.readyState || !ep ? au.currentTime : (S.pos[ep.id] || 0), pct = d ? t / d * 100 : 0;
  $('cur').textContent = fmt(t); $('rem').textContent = '-' + fmt(d - t);
  $('fill').style.width = pct + '%'; $('knob').style.left = pct + '%'; $('miniLine').style.width = pct + '%';
  const ic = au.paused ? I.play : I.pause;
  if ($('play').dataset.s !== ic) { $('play').dataset.s = ic; $('play').innerHTML = $('miniPlay').innerHTML = ic }
  if ('mediaSession' in navigator && au.duration) try {
    navigator.mediaSession.setPositionState({ duration: au.duration, position: Math.min(t, au.duration), playbackRate: au.playbackRate });
  } catch {}
}
let lastSave = 0;
au.ontimeupdate = () => {
  tick();
  if (ep && Math.abs(au.currentTime - lastSave) >= 5) {
    lastSave = au.currentTime; S.pos[ep.id] = au.currentTime;
    if (au.currentTime > 5) delete S.done[ep.id];
    save(); renderList();
  }
};
au.onplay = au.onpause = () => {
  if (!au.paused) touchDay();
  if (ep && au.readyState) { S.pos[ep.id] = au.currentTime; save() }
  tick(); renderHome();
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = au.paused ? 'paused' : 'playing';
};
au.onerror = () => { if (ep) alert('โหลดไฟล์เสียงไม่ได้ (' + ep.src + ')') };
// ฟังจบ: มีคำถามท้ายตอนก็ถาม แล้วเล่นตอนต่อไปเอง (ข้าม Part ได้)
// ถ้าแอปอยู่เบื้องหลัง เล่นตอนต่อไปเลย แล้วเก็บคำถามไว้ถามตอนกลับมา
const pending = [];
au.onended = () => {
  const e = ep;
  S.pos[e.id] = 0; S.done[e.id] = 1; S.fin[e.id] = 1; save(); renderHome(); renderPlayer();
  if (!quizOpen(e)) return next();
  if (document.hidden) { pending.push(e); next() }
  else quiz(e, 'end');
};
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (ep && au.readyState) { S.pos[ep.id] = au.currentTime; save() } }
  else if (pending.length && !$('modal').classList.contains('on')) quiz(pending.shift(), 'pending');
});
function media() {

function xOrder(i) {

}

// ---------- ดาว / ระดับ / เหรียญ / วันต่อเนื่อง ----------
// ดาว: ฟังจบ 1 ตอน = 1, ตอบคำถามท้ายตอนถูก 1 ข้อ = 1, แนวข้อสอบ = คะแนนสูงสุดที่เคยทำได้
const LV = [[0, 'ผู้เริ่มต้น', '🌱'], [.12, 'นักฟัง', '🎧'], [.3, 'นักเรียนธรรม', '📖'], [.5, 'ยุวชนตัวจริง', '💪'], [.72, 'พร้อมสอบ', '🎯'], [.9, 'ยอดยุวชน', '🏆'], [1, 'ตำนาน BKK11', '👑']];
const SHARE_URL = 'https://tanawat40889.github.io/bkk11-podcast/?openExternalBrowser=1';
function prog() {
  const fin = allEps.filter(e => S.fin[e.id]).length, quiz = allEps.reduce((a, e) => a + correct(e), 0), quizTot = allEps.reduce((a, e) => a + e.questions.length, 0);
  S.xbest = Math.max(S.xbest || 0, xOk()); if (xAns() === XQ.length) S.xdone = 1;
  const stars = fin + quiz + S.xbest, total = allEps.length + quizTot + XQ.length;
  let lv = 0; LV.forEach((l, i) => { if (stars >= Math.ceil(l[0] * total)) lv = i });
  const nextAt = lv < LV.length - 1 ? Math.ceil(LV[lv + 1][0] * total) : total, curAt = Math.ceil(LV[lv][0] * total);
  const st = S.streak || { n: 0, best: 0 };
  const badges = [
    ...P.parts.map(p => [`🎧`, `ฟังจบ ${p.name}`, p.episodes.length && p.episodes.every(e => S.fin[e.id])]),
    ['🎯', 'ตอบถูกทั้งตอน', allEps.some(e => e.questions.length && correct(e) === e.questions.length)],
    ['🧠', 'ท้ายตอนเต็มทุกข้อ', quizTot > 0 && quiz === quizTot],
    ['📝', 'ทำข้อสอบครบ', !!S.xdone],
    ['🏅', 'ข้อสอบ 80%+', S.xbest >= XQ.length * .8],
    ['💯', 'ข้อสอบเต็ม', S.xbest === XQ.length],
    ['🔥', '3 วันติด', st.best >= 3],
    ['⚡', '7 วันติด', st.best >= 7],
    ['👑', 'เก็บดาวครบ', stars === total]
  ];
  return { fin, quiz, quizTot, stars, total, lv, nextAt, curAt, st, badges };
}
const today = (d = new Date()) => `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
function touchDay() {
  const t = today(), st = S.streak ||= { d: '', n: 0, best: 0 };
  if (st.d === t) return;
  st.n = st.d === today(new Date(Date.now() - 864e5)) ? st.n + 1 : 1;
  st.d = t; st.best = Math.max(st.best, st.n); save();
  if (st.n > 1) toast(`🔥 เข้ามาติว ${st.n} วันติดแล้ว!`);
}
let lastStars = 0, lastLv = 0, toastT = 0;
function toast(msg) {
  $('toast').textContent = msg; $('toast').classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => $('toast').classList.remove('on'), 2600);
}
function checkStars() {
  const p = prog(); store();
  document.querySelectorAll('.stars').forEach(b => b.innerHTML = `<span>⭐ <b>${p.stars}</b> / ${p.total}</span><span>${LV[p.lv][2]} ${LV[p.lv][1]}</span>`);
  $('sideBar').style.width = p.stars / p.total * 100 + '%';
  if (p.lv > lastLv) toast(`🎉 เลื่อนระดับเป็น ${LV[p.lv][2]} ${LV[p.lv][1]}!`);
  else if (p.stars > lastStars) toast(`+${p.stars - lastStars} ⭐ ได้ดาวเพิ่ม! (${p.stars}/${p.total})`);
  lastStars = p.stars; lastLv = p.lv;
  if ($('rw').classList.contains('on')) renderRewards();
}
function renderRewards() {
  const p = prog(), l = LV[p.lv], nx = LV[p.lv + 1];
  $('rwBody').innerHTML = `<div class="rw-top"><div class="em">${l[2]}</div><h3>${l[1]}</h3><div class="n">⭐ ${p.stars} / ${p.total} ดาว</div>
      <div class="rw-bar"><i style="width:${nx ? (p.stars - p.curAt) / (p.nextAt - p.curAt) * 100 : 100}%"></i></div>
      <small>${nx ? `อีก ${p.nextAt - p.stars} ดาว เลื่อนเป็น ${nx[2]} ${nx[1]}` : 'เก็บดาวครบทุกดวงแล้ว สุดยอด!'}</small></div>
    <h4>เก็บดาวจากไหนได้บ้าง</h4>
    <div class="rw-rows"><div><span>🎧 ฟังพอดแคสต์จนจบตอน</span><b>${p.fin} / ${allEps.length}</b></div>
      <div><span>❓ ตอบคำถามท้ายตอนถูก</span><b>${p.quiz} / ${p.quizTot}</b></div>
      <div><span>📝 แนวข้อสอบ (คะแนนสูงสุด)</span><b>${S.xbest} / ${XQ.length}</b></div>
      <div><span>🔥 เข้ามาติวต่อเนื่อง</span><b>${p.st.n || 0} วัน</b></div></div>
    <h4>เหรียญรางวัล ${p.badges.filter(b => b[2]).length} / ${p.badges.length}</h4>
    <div class="rw-bd">${p.badges.map(b => `<div class="${b[2] ? 'got' : ''}"><span>${b[0]}</span>${b[1]}</div>`).join('')}</div>
    <button id="rwShare">📣 แชร์ชวนเพื่อนมาติว</button><button class="ghost" id="rwClose">ปิด</button>`;
  $('rwClose').onclick = () => $('rw').classList.remove('on');
  $('rwShare').onclick = async () => {
    const text = `ฉันเก็บได้ ⭐ ${p.stars}/${p.total} ดาว ระดับ "${l[1]}" ${l[2]} ใน BKK11 Podcast ติวธรรมะ 🎧 มาติวด้วยกันนะ!`;
    try { if (navigator.share) return await navigator.share({ text, url: SHARE_URL }) } catch { return }
    try { await navigator.clipboard.writeText(`${text}\n${SHARE_URL}`); toast('คัดลอกข้อความแล้ว เอาไปวางใน LINE ได้เลย') } catch { prompt('คัดลอกข้อความนี้ไปแชร์', `${text}\n${SHARE_URL}`) }
  };
}
document.querySelectorAll('.stars').forEach(b => b.onclick = () => { renderRewards(); $('rw').classList.add('on') });
$('rw').onclick = e => { if (e.target === $('rw')) $('rw').classList.remove('on') };

renderHome(); score(); tick();
{ const p = prog(); lastStars = p.stars; lastLv = p.lv; checkStars(); ready = true }
// เปิดแอปมา: โหลดตอนล่าสุดค้างไว้ที่ตำแหน่งเดิม (ยังไม่เล่นจนกว่าจะกด)
{ const last = allEps.find(e => e.id === S.last); if (last) load(last, false) }
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
